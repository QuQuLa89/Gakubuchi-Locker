version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "io.papermc.paper:paper-api"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
